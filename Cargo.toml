[package]
name = "timelapse"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Session-based screenshot collection and timelapse rendering"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.5"
directories = "6.0"
humantime = "2.3"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.9"
xcap = "0.9.6"
ratatui = "0.30.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }


[dev-dependencies]
tempfile = "3.23"
